<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Assistant</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>AI Interview Assistant</h1>

        <div class="status">
            <span id="status-indicator" class="indicator"></span>
            <span id="status-text">Проверка подключения...</span>
        </div>

        <div class="controls">
            <button id="start-btn" class="btn btn-primary">
                <span>🎤</span> Начать запись
            </button>
            <button id="stop-btn" class="btn btn-secondary" disabled>
                <span>⏹️</span> Остановить
            </button>
        </div>

        <div class="transcript-section">
            <h3>Распознанный вопрос:</h3>
            <div id="transcript" class="text-box"></div>
        </div>

        <div class="answer-section">
            <h3>Предлагаемый ответ:</h3>
            <div id="answer" class="text-box"></div>
        </div>

        <div class="settings">
            <button id="settings-btn" class="btn btn-link">⚙️ Настройки</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
