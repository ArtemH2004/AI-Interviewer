services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Set PYTHON_IMAGE in .env}
    container_name: ai-interview-backend
    ports:
      - "${API_PUBLISH_HOST:?}:${API_PUBLISH_PORT:?}:${API_PORT:?}"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:?Set OLLAMA_DOCKER_BASE_URL in .env}
    volumes:
      - ./backend:/app/backend
      - whisper-cache:/root/.cache/huggingface
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE in .env}
    ports:
      - "${OLLAMA_PUBLISH_HOST:?}:${OLLAMA_PORT:?}:11434"
    env_file:
      - .env
    volumes:
      - ollama-cache:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-cache:
    driver: local
  whisper-cache:
    driver: local
